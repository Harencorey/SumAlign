name: Build macOS installer (AU + VST3 + Standalone)

# Every branch builds, tests and validates. main publishes the official releases;
# any other branch (one per phase: phase-2, phase-3, ...) publishes a pre-release test build
# under the tag test-<branch>, replaced on every push, so it can be tried before merging.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish the Releases page

# only the newest push of each branch builds/publishes (an older run would tag a stale commit)
concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15   # Apple Silicon runner (macos-14 was retired); the build itself is universal (arm64 + x86_64)
    timeout-minutes: 60
    env:
      VERSION: 0.1.${{ github.run_number }}
      ART: build-mac/SumAlign_artefacts/Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the commit message goes into the version's release notes

      - name: Configure (downloads JUCE 8.0.15)
        run: cmake -B build-mac -DCMAKE_BUILD_TYPE=Release -DSA_VERSION=${{ env.VERSION }}

      - name: Build
        run: cmake --build build-mac --config Release --target SumAlign_AU SumAlign_VST3 SumAlign_Standalone AlignTests AlignProcessorTests -j "$(sysctl -n hw.ncpu)"

      - name: Engine tests (delay accuracy, null, phase, polarity, clicks, block-size independence, no audio-thread allocations)
        run: bash .github/run_test.sh ./build-mac/AlignTests

      - name: Plug-in tests (bus layouts, reference sidechain, reported latency, bypass, session save/load)
        run: bash .github/run_test.sh ./build-mac/AlignProcessorTests_artefacts/Release/AlignProcessorTests

      - name: Check binaries are universal
        run: |
          lipo -info "$ART/AU/SumAlign.component/Contents/MacOS/SumAlign"
          lipo -info "$ART/VST3/SumAlign.vst3/Contents/MacOS/SumAlign"
          lipo -info "$ART/Standalone/SumAlign.app/Contents/MacOS/SumAlign"

      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - "$ART/AU/SumAlign.component"
          codesign --force --deep --sign - "$ART/VST3/SumAlign.vst3"
          codesign --force --deep --sign - "$ART/Standalone/SumAlign.app"

      - name: Build installer
        run: bash packaging/make_pkg.sh "$ART" "$VERSION" out

      - name: Test the installer (install exactly as a user would)
        run: |
          # remove the copies the build step dropped in ~/Library so we only test what the .pkg installs
          rm -rf ~/Library/Audio/Plug-Ins/Components/"SumAlign.component" ~/Library/Audio/Plug-Ins/VST3/"SumAlign.vst3"
          sudo installer -pkg out/SumAlign-Installer.pkg -target /
          ls -la "/Library/Audio/Plug-Ins/Components/SumAlign.component" "/Library/Audio/Plug-Ins/VST3/SumAlign.vst3"
          pkgutil --pkgs | grep norkadsp

      - name: Validate installed AU with Apple auval
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aufx SmAl Nrka | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log

      - name: Validate installed VST3 + AU with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "/Library/Audio/Plug-Ins/VST3/SumAlign.vst3"
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "/Library/Audio/Plug-Ins/Components/SumAlign.component"

      - name: Package extras
        run: |
          ditto -c -k --keepParent "$ART/Standalone/SumAlign.app" out/SumAlign-Standalone.app.zip
          ditto -c -k --keepParent "$ART/AU/SumAlign.component" out/SumAlign.component.zip
          ditto -c -k --keepParent "$ART/VST3/SumAlign.vst3" out/SumAlign.vst3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SumAlign-macOS
          path: out/*
          retention-days: 30

      - name: Publish a test build for this branch
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          TAG="test-${BRANCH//\//-}"
          {
            echo "**Test build of branch \`${BRANCH}\`** (SumAlign ${VERSION}, ${GITHUB_SHA::7}, $(date -u +%Y-%m-%d)). Not merged into main yet."
            echo "Passed the engine and plug-in tests, Apple auval and pluginval (strictness 10)."
            echo
            echo "### Latest change"
            git log -1 --format=%B "$GITHUB_SHA" | grep -v -E '^(Co-Authored-By|Claude-Session):'
            echo
            echo "**Install:** download **SumAlign-Installer.pkg** and double-click it (same Open Anyway step as the official release). It replaces whatever SumAlign you have; reinstall the official **latest** release to go back."
          } > test-notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          gh release create "$TAG" out/* --verify-tag --prerelease --latest=false --title "TEST BUILD: ${BRANCH} (${VERSION})" --notes-file test-notes.md
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url -q .url

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          **SumAlign ${VERSION}**, built from ${GITHUB_SHA::7}. Universal (Apple Silicon + Intel).
          The installer was test-installed on a Mac and passed the engine and plug-in tests, Apple auval and pluginval (strictness 10).

          **Install:** download **SumAlign-Installer.pkg** and double-click it.
          The first time, macOS will say it can't verify the developer (it isn't Apple-notarized yet).
          Click **Done**, then go to **System Settings > Privacy & Security**, scroll down, and click **Open Anyway** next to SumAlign-Installer.
          (Or right-click the .pkg and choose **Open**.) It installs the AU + VST3 and replaces any older SumAlign.
          Rescan plug-ins in your DAW and look for **Norka DSP > SumAlign**. The version is shown in the plug-in window.

          **Standalone:** download **SumAlign-Standalone.app.zip**, unzip, and drag the app to Applications (same Open Anyway step).

          The component/vst3 zips are only needed for manual installs.
          NOTES
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          # point the tag at this commit first, so the release never ends up as an unpublished draft
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          gh release create latest out/* --verify-tag --latest --title "SumAlign ${VERSION} (latest macOS build)" --notes-file notes.md
          gh release edit latest --draft=false
          gh release view latest --json isDraft,url -q '"draft=" + (.isDraft|tostring) + "  " + .url'
          test "$(gh release view latest --json isDraft -q .isDraft)" = "false"

      - name: Publish a permanent release for this version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "latest" is replaced on every build; this one (v0.1.N) is kept forever so any
          # past version can be reinstalled. What changed = this commit's message.
          {
            echo "**SumAlign ${VERSION}**, built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Passed the engine and plug-in tests, Apple auval and pluginval (strictness 10)."
            echo
            echo "### What changed"
            git log -1 --format=%B "$GITHUB_SHA" | grep -v -E '^(Co-Authored-By|Claude-Session):'
            echo
            echo "**Install:** download **SumAlign-Installer.pkg** and double-click it (same steps as the latest release). Installing any version replaces whatever SumAlign you have."
          } > version-notes.md
          gh release delete "v${VERSION}" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "v${VERSION}" "$GITHUB_SHA"
          git push -f origin "refs/tags/v${VERSION}"
          gh release create "v${VERSION}" out/* --verify-tag --latest=false --title "SumAlign ${VERSION}" --notes-file version-notes.md
          gh release edit "v${VERSION}" --draft=false
